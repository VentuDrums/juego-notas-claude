<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juego de notas</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="title"></h1>
      <button type="button" id="mute" class="icon"></button>
    </header>

    <section id="home" data-screen hidden>
      <h2 data-i18n="chooseMode"></h2>
      <div class="actions">
        <button type="button" id="solo" class="primary" data-i18n="solo"></button>
        <button type="button" id="board" data-i18n="board" disabled></button>
      </div>
      <div class="langs">
        <button type="button" data-lang="es">Español</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </section>

    <section id="choose-level" data-screen hidden>
      <h2 data-i18n="chooseLevel"></h2>
      <div id="levels" class="actions"></div>
      <div class="actions">
        <button type="button" data-go="home" data-i18n="back"></button>
      </div>
    </section>

    <section id="play" data-screen hidden>
      <div class="bar">
        <button type="button" class="exit" data-go="choose-level" data-i18n="exit"></button>
        <span id="progress"></span>
        <span id="score"></span>
      </div>
      <div class="timer"><div id="time"></div></div>
      <div id="staff"></div>
      <p id="feedback" aria-live="polite"></p>
      <div id="answers"></div>
    </section>

    <section id="result" data-screen hidden>
      <h2 data-i18n="result"></h2>
      <p id="new-record" class="ok" data-i18n="newRecord"></p>
      <p id="final-score" class="big"></p>
      <p id="final-hits"></p>
      <div class="actions">
        <button type="button" id="again" class="primary" data-i18n="playAgain"></button>
        <button type="button" data-go="choose-level" data-i18n="changeLevel"></button>
        <button type="button" data-go="home" data-i18n="home"></button>
      </div>
    </section>
  </main>
</body>
</html>
