<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juego de notas</title>
  <link rel="preload" href="fonts/rubik.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>
        <svg class="mark" viewBox="0 0 28 24" aria-hidden="true">
          <rect x="0" y="0" width="3" height="24" rx="1.5" style="fill: var(--note-C)" />
          <rect x="4" y="2" width="3" height="20" rx="1.5" style="fill: var(--note-D)" />
          <rect x="8" y="3.5" width="3" height="17" rx="1.5" style="fill: var(--note-E)" />
          <rect x="12" y="5" width="3" height="14" rx="1.5" style="fill: var(--note-F)" />
          <rect x="16" y="6" width="3" height="12" rx="1.5" style="fill: var(--note-G)" />
          <rect x="20" y="7" width="3" height="10" rx="1.5" style="fill: var(--note-A)" />
          <rect x="24" y="8" width="3" height="8" rx="1.5" style="fill: var(--note-B)" />
        </svg>
        <span data-i18n="title"></span>
      </h1>
      <button type="button" id="mute" class="icon"></button>
    </header>

    <section id="home" data-screen hidden>
      <h2 data-i18n="chooseMode"></h2>
      <div class="actions">
        <button type="button" id="solo" class="primary" data-i18n="solo"></button>
        <button type="button" id="board" data-i18n="board"></button>
      </div>
      <div class="langs">
        <button type="button" data-lang="es">Español</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </section>

    <section id="choose-level" data-screen hidden>
      <h2 data-i18n="chooseLevel"></h2>
      <div id="levels" class="actions"></div>
      <div class="actions">
        <button type="button" data-go="home" data-i18n="back"></button>
      </div>
    </section>

    <section id="play" data-screen hidden>
      <div class="bar">
        <button type="button" class="exit" data-go="choose-level" data-i18n="exit"></button>
        <span id="progress"></span>
        <span id="score"></span>
      </div>
      <div class="timer"><div id="time"></div></div>
      <div id="staff"></div>
      <p id="feedback" aria-live="polite"></p>
      <div id="answers"></div>
    </section>

    <section id="result" data-screen hidden>
      <h2 data-i18n="result"></h2>
      <p id="new-record" class="ok" data-i18n="newRecord"></p>
      <p id="final-score" class="big"></p>
      <p id="final-hits"></p>
      <div class="actions">
        <button type="button" id="again" class="primary" data-i18n="playAgain"></button>
        <button type="button" data-go="choose-level" data-i18n="changeLevel"></button>
        <button type="button" data-go="home" data-i18n="home"></button>
      </div>
    </section>

    <section id="board-setup" data-screen hidden>
      <h2 data-i18n="boardSetup"></h2>
      <h3 data-i18n="level"></h3>
      <div id="board-levels" class="choice"></div>
      <h3 data-i18n="rounds"></h3>
      <div id="board-rounds" class="choice">
        <button type="button" data-rounds="5">5</button>
        <button type="button" data-rounds="10">10</button>
        <button type="button" data-rounds="15">15</button>
      </div>
      <div class="actions">
        <button type="button" id="board-start" class="primary" data-i18n="start"></button>
        <button type="button" data-go="home" data-i18n="back"></button>
      </div>
    </section>

    <section id="board-play" data-screen hidden>
      <div class="bar">
        <button type="button" class="exit" data-go="board-setup" data-i18n="exit"></button>
        <span id="round"></span>
      </div>
      <div class="timer"><div id="board-time"></div></div>
      <div class="teams">
        <div class="team" data-team="red">
          <div class="team-head"><span data-i18n="red"></span><span class="team-score"></span></div>
          <div class="team-staff"></div>
          <p class="team-feedback" aria-live="polite"></p>
          <div class="team-answers"></div>
        </div>
        <div class="team" data-team="blue">
          <div class="team-head"><span data-i18n="blue"></span><span class="team-score"></span></div>
          <div class="team-staff"></div>
          <p class="team-feedback" aria-live="polite"></p>
          <div class="team-answers"></div>
        </div>
      </div>
    </section>

    <section id="board-result" data-screen hidden>
      <h2 id="board-winner"></h2>
      <p id="board-score" class="big"></p>
      <div class="actions">
        <button type="button" id="board-again" class="primary" data-i18n="playAgain"></button>
        <button type="button" data-go="home" data-i18n="home"></button>
      </div>
    </section>
  </main>
</body>
</html>
